name: Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — Schema Contract Check
  # ---------------------------------------------------------------------------
  schema-check:
    name: Schema Contract Check (ajv-cli)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate reading profile contracts against schema
        run: |
          echo "Validating reading-profile contracts..."
          ajv validate \
            --spec=draft7 \
            -c ajv-formats \
            -s docs/contracts/reading-profile.schema.json \
            -d docs/contracts/reading-profile.example.json
          
          # Also validate any sample profiles if present
          if ls docs/sample-profiles/*.json 1> /dev/null 2>&1; then
            ajv validate \
              --spec=draft7 \
              -c ajv-formats \
              -s docs/contracts/reading-profile.schema.json \
              -d "docs/sample-profiles/*.json"
          fi
          echo "All reading profile contracts are valid!"

  # ---------------------------------------------------------------------------
  # JOB 2 — Spring Boot Backend Tests (Gradle)
  # ---------------------------------------------------------------------------
  backend-test:
    name: Spring Boot Tests (Gradle)
    runs-on: ubuntu-latest
    needs: schema-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x backend/gradlew

      - name: Run Spring Boot Gradle tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Publish JUnit Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Gradle Test Results
          path: "backend/build/test-results/test/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

  # ---------------------------------------------------------------------------
  # JOB 3 — React Frontend Build (Vite)
  # ---------------------------------------------------------------------------
  frontend-build:
    name: React Frontend Build (Vite)
    runs-on: ubuntu-latest
    needs: schema-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Production build (tsc + vite build)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run build
        env:
          CI: true

      - name: Notice if frontend is awaiting merge
        if: hashFiles('frontend/package.json') == ''
        run: echo "::notice::frontend/package.json not yet in branch. Frontend checks will run automatically once frontend PR is merged."
