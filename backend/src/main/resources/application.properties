spring.application.name=dyslexiaapp
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/dyslexia_reader
spring.datasource.username=dyslexia
spring.datasource.password=dyslexia

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

dyslexia.tts.google.api-key=${GOOGLE_CLOUD_API_KEY:}
dyslexia.tts.google.endpoint=https://texttospeech.googleapis.com/v1beta1/text:synthesize
dyslexia.tts.demo-mode=${DYSLEXIA_TTS_DEMO_MODE:false}
dyslexia.tts.cache-ttl-hours=${DYSLEXIA_TTS_CACHE_TTL_HOURS:48}

